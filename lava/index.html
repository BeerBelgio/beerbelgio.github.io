<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="copyright" content="© 2026 Matteo Belgiovine. All rights reserved.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#973320">
  <title>Lava — BeerBelgio</title>
  <link rel="icon" href="../assets/favicon.svg?v=037" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/fonts/m-plus-rounded-1c/font.css?v=037">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #973320;
    }
    body { font-family: "M PLUS Rounded 1c", sans-serif; }

    #lava-canvas {
      position: fixed;
      left: calc(-1 * env(safe-area-inset-left, 0px));
      top: calc(-1 * env(safe-area-inset-top, 0px));
      width: calc(100vw + env(safe-area-inset-left, 0px) + env(safe-area-inset-right, 0px));
      height: calc(100vh + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
      height: calc(100lvh + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
      display: block;
      transform: translateZ(0);
      will-change: transform;
    }

    .hud {
      position: fixed;
      z-index: 2;
      inset: 18px 18px auto 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .hud img { width: 16px; height: 16px; display: block; }
    .hud a, .hud span {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 15px;
      border-radius: 999px;
      background: #e7d9c1;
      color: #1c1713;
      text-decoration: none;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <canvas id="lava-canvas" aria-label="Interactive BeerBelgio lava"></canvas>

  <div class="hud">
    <a href="../"><img src="../assets/icon-arrow-left.svg?v=037" alt=""> HUB</a>
    <span>MOVE / CLICK / WHEEL</span>
  </div>

  <script src="../lava.js?v=037"></script>
</body>
</html>
